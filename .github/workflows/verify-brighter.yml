name: Verify brighter Porsche

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium

      - name: Serve site
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Screenshot at multiple scroll depths
        timeout-minutes: 2
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1400, height: 900 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push('pageerror: ' + err.message));

            await page.goto('http://localhost:8080/index.html', { waitUntil: 'load', timeout: 45000 });
            await page.waitForTimeout(3000);

            const scrollHeight = await page.evaluate(() => document.documentElement.scrollHeight - window.innerHeight);
            console.log('scrollHeight (scrollable px):', scrollHeight);

            const depths = [0.05, 0.3, 0.6, 0.95];
            const fs = require('fs');
            for (const d of depths) {
              await page.evaluate((y) => window.scrollTo(0, y), Math.round(scrollHeight * d));
              await page.waitForTimeout(600);
              const buf = await page.screenshot();
              const name = `shot_${Math.round(d*100)}.png`;
              fs.writeFileSync(name, buf);
              console.log('SHOT', name, 'base64start');
              console.log(buf.toString('base64'));
              console.log('SHOT', name, 'base64end');
            }

            console.log('CONSOLE_ERRORS_START');
            console.log(JSON.stringify(consoleErrors, null, 2));
            console.log('CONSOLE_ERRORS_END');

            await browser.close();
            process.exit(0);
          })().catch((err) => { console.error('SCRIPT_ERROR', err); process.exit(1); });
          EOF

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: brighter-screenshots
          path: shot_*.png
