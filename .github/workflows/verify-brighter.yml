name: Verify brighter Porsche

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium

      - name: Serve site
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Screenshot where the fixed 3D canvas is visible
        timeout-minutes: 2
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1400, height: 900 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push('pageerror: ' + err.message));

            await page.goto('http://localhost:8080/index.html', { waitUntil: 'load', timeout: 45000 });
            await page.waitForTimeout(4000);

            const fs = require('fs');

            // #processus and #instagram have no opaque background, by design, so the
            // fixed lunar/Porsche canvas (z-index:-1) shows directly behind their text.
            const targets = ['#processus', '#instagram'];
            for (const sel of targets) {
              const box = await page.evaluate((s) => {
                const el = document.querySelector(s);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { top: r.top + window.scrollY, height: r.height };
              }, sel);
              if (!box) { console.log('MISSING SECTION', sel); continue; }
              const y = Math.round(box.top + box.height / 2 - 450);
              await page.evaluate((yy) => window.scrollTo(0, Math.max(0, yy)), y);
              await page.waitForTimeout(900);
              const buf = await page.screenshot();
              const name = sel.replace('#', 'shot_') + '.png';
              fs.writeFileSync(name, buf);
              console.log('SHOT', name, 'base64start');
              console.log(buf.toString('base64'));
              console.log('SHOT', name, 'base64end');
            }

            console.log('CONSOLE_ERRORS_START');
            console.log(JSON.stringify(consoleErrors, null, 2));
            console.log('CONSOLE_ERRORS_END');

            await browser.close();
            process.exit(0);
          })().catch((err) => { console.error('SCRIPT_ERROR', err); process.exit(1); });
          EOF

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: brighter-screenshots
          path: shot_*.png
