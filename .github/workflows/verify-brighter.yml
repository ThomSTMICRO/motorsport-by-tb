name: Verify brighter Porsche

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium

      - name: Serve site
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Diagnose the 3D canvas directly
        timeout-minutes: 2
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1400, height: 900 } });
            const consoleErrors = [];
            const failedRequests = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push('pageerror: ' + err.message));
            page.on('requestfailed', req => failedRequests.push(req.url() + ' :: ' + (req.failure() && req.failure().errorText)));
            page.on('response', res => { if (!res.ok() && res.url().includes('models/')) failedRequests.push(res.url() + ' :: HTTP ' + res.status()); });

            await page.goto('http://localhost:8080/index.html', { waitUntil: 'load', timeout: 45000 });
            await page.waitForTimeout(6000);

            const state = await page.evaluate(() => {
              const stage = document.querySelector('.bike3d-fixed');
              const canvas = stage ? stage.querySelector('canvas') : null;
              return {
                stageFound: !!stage,
                isReady: stage ? stage.classList.contains('is-ready') : null,
                canvasFound: !!canvas,
                canvasSize: canvas ? [canvas.width, canvas.height] : null,
              };
            });
            console.log('STATE', JSON.stringify(state));

            const fs = require('fs');
            const stageHandle = await page.$('.bike3d-fixed');
            if (stageHandle) {
              const buf = await stageHandle.screenshot();
              fs.writeFileSync('shot_canvas.png', buf);
              console.log('SHOT shot_canvas.png base64start');
              console.log(buf.toString('base64'));
              console.log('SHOT shot_canvas.png base64end');
            }

            console.log('FAILED_REQUESTS_START');
            console.log(JSON.stringify(failedRequests, null, 2));
            console.log('FAILED_REQUESTS_END');

            console.log('CONSOLE_ERRORS_START');
            console.log(JSON.stringify(consoleErrors, null, 2));
            console.log('CONSOLE_ERRORS_END');

            await browser.close();
            process.exit(0);
          })().catch((err) => { console.error('SCRIPT_ERROR', err); process.exit(1); });
          EOF

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: brighter-screenshots
          path: shot_*.png
