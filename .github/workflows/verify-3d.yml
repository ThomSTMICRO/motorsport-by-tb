name: Verify 3D showcase (diagnostic, manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local server
        run: |
          python3 -m http.server 8080 &
          sleep 1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.48.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Render and check the 3D showcase
        run: |
          cat > check.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleMsgs = [];
            page.on('console', m => consoleMsgs.push(m.type() + ': ' + m.text()));
            page.on('pageerror', e => consoleMsgs.push('pageerror: ' + e.message));
            page.on('requestfailed', r => consoleMsgs.push('requestfailed: ' + r.url() + ' ' + (r.failure()?.errorText)));

            await page.goto('http://localhost:8080/index.html', { waitUntil: 'load', timeout: 30000 });
            await page.evaluate(() => document.getElementById('apercu3d').scrollIntoView({block:'start'}));

            // Attend soit que le chargement se termine, soit 15s max.
            await page.waitForFunction(() => {
              const el = document.getElementById('showcase3dLoading');
              return el && (el.classList.contains('is-hidden') || el.classList.contains('is-error'));
            }, { timeout: 15000 }).catch(() => console.log('TIMEOUT waiting for load state'));

            await page.waitForTimeout(1500);
            await page.screenshot({ path: 'showcase3d-check.png' });

            const state = await page.evaluate(() => {
              const el = document.getElementById('showcase3dLoading');
              const canvas = document.querySelector('#showcase3dStage canvas');
              return {
                loadingClasses: el ? el.className : 'MISSING',
                loadingText: el ? el.textContent : 'MISSING',
                hasCanvas: !!canvas,
                canvasSize: canvas ? [canvas.width, canvas.height] : null
              };
            });
            console.log('STATE', JSON.stringify(state, null, 2));
            console.log('CONSOLE_LOG', JSON.stringify(consoleMsgs.slice(0, 60), null, 2));

            // Petite vignette JPEG du seul canvas, encodée en base64 pour inspection visuelle
            // directe dans les logs (le poste d'exécution qui écrit ceci n'a pas accès aux
            // artefacts binaires externes).
            const stageBox = await page.locator('#showcase3dStage').boundingBox();
            const thumb = await page.screenshot({
              clip: { x: stageBox.x, y: stageBox.y, width: stageBox.width, height: stageBox.height },
              type: 'jpeg',
              quality: 40
            });
            const resized = await page.evaluate(async (b64) => {
              const img = new Image();
              await new Promise((res) => { img.onload = res; img.src = 'data:image/jpeg;base64,' + b64; });
              const canvas = document.createElement('canvas');
              canvas.width = 320;
              canvas.height = Math.round(320 * img.height / img.width);
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              return canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
            }, thumb.toString('base64'));
            console.log('THUMB_B64_START');
            console.log(resized);
            console.log('THUMB_B64_END');

            await browser.close();
          })();
          EOF
          node check.js

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase3d-check
          path: showcase3d-check.png
          if-no-files-found: ignore
          retention-days: 3
