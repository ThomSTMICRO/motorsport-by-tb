name: Diagnostic - verify hero 3D (Porsche)
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.47.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Serve site
        run: |
          npx http-server -p 8080 . &
          sleep 2

      - name: Run hero3d check
        run: |
          cat > check.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push('PAGEERROR: ' + err.message));

            await page.goto('http://localhost:8080/index.html', { waitUntil: 'networkidle', timeout: 30000 });

            // attendre que le modèle soit chargé (classe is-ready) jusqu'à 20s
            await page.waitForFunction(() => document.querySelector('.hero-3d-stage')?.classList.contains('is-ready'), { timeout: 20000 }).catch(() => {});
            await page.waitForTimeout(1500);

            const state = await page.evaluate(() => {
              const stage = document.querySelector('.hero-3d-stage');
              const canvas = stage ? stage.querySelector('canvas') : null;
              return {
                isReady: stage ? stage.classList.contains('is-ready') : null,
                canvasPresent: !!canvas,
                canvasSize: canvas ? { w: canvas.width, h: canvas.height } : null,
              };
            });
            console.log('HERO3D_STATE', JSON.stringify(state));
            await page.screenshot({ path: '/tmp/hero3d_gha.jpg', type: 'jpeg', quality: 70 });

            // légère attente pour vérifier la rotation (turntable) entre deux captures
            await page.waitForTimeout(1200);
            await page.screenshot({ path: '/tmp/hero3d_gha_2.jpg', type: 'jpeg', quality: 70 });

            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors));
            await browser.close();
          })();
          EOF
          node check.js

      - name: Print thumbnails as base64
        run: |
          for f in /tmp/hero3d_gha.jpg /tmp/hero3d_gha_2.jpg; do
            echo "=== $f ==="
            base64 -w 0 "$f"
            echo ""
          done
