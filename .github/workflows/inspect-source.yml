name: Inspect external source (diagnostic, manual only)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to inspect"
        required: true
        default: "https://motorsport-by-tb.espacevo.fr/"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch raw HTML
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" "${{ inputs.url }}" -o raw.html
          echo "----- SIZE -----"
          wc -c raw.html
          echo "----- TITLE -----"
          grep -o '<title>[^<]*</title>' raw.html || true
          echo "----- HEAD SNIPPET (first 3000 chars) -----"
          head -c 3000 raw.html
          echo ""
          echo "----- BODY TAG OPENING (to detect SPA shell) -----"
          grep -o '<body[^>]*>.\{0,600\}' raw.html || true
          echo ""
          echo "----- JSON-LD BLOCKS -----"
          grep -o '<script type="application/ld+json">.*</script>' raw.html | head -c 4000 || true
          echo ""
          echo "----- SCRIPT SRC TAGS -----"
          grep -o '<script[^>]*src="[^"]*"' raw.html | sort -u | head -40
          echo ""
          echo "----- OCCURRENCES OF LIKELY MARKERS -----"
          for term in "vehicule" "annonce" "listing" "car-card" "price" "prix" "km" "__NEXT_DATA__" "window.__" "application/json" "data-vehicle" "react" "vue" "ng-app"; do
            count=$(grep -o -i "$term" raw.html | wc -l)
            echo "$term: $count"
          done

      - name: Try common feed/export endpoints
        run: |
          base="${{ inputs.url }}"
          base="${base%/}"
          for path in "robots.txt" "sitemap.xml" "flux.xml" "export.xml" "api/vehicles" "api/vehicules" "feed.xml" "wp-json/" "vehicules.json"; do
            echo "----- $path -----"
            curl -sL -o /dev/null -w "HTTP %{http_code} - %{url_effective}\n" "$base/$path" || true
          done

      - name: Rendered DOM via headless Chromium (in case of SPA)
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.48.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > render.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(process.env.TARGET_URL, { waitUntil: 'networkidle', timeout: 45000 }).catch(e => console.log('goto error', e.message));
            await page.waitForTimeout(3000);
            const html = await page.content();
            require('fs').writeFileSync('rendered.html', html);
            const text = await page.evaluate(() => document.body.innerText.slice(0, 4000));
            console.log('----- VISIBLE TEXT (first 4000 chars) -----');
            console.log(text);
            const cardGuess = await page.evaluate(() => {
              const candidates = Array.from(document.querySelectorAll('a,article,li,div'))
                .filter(el => /\d[\s.,]?\d{2,3}\s?(€|EUR)/i.test(el.textContent || '') && el.textContent.length < 600)
                .slice(0, 5);
              return candidates.map(el => ({ tag: el.tagName, class: el.className, html: el.outerHTML.slice(0, 800) }));
            });
            console.log('----- CANDIDATE VEHICLE CARD ELEMENTS -----');
            console.log(JSON.stringify(cardGuess, null, 2));
            await browser.close();
          })();
          EOF
          TARGET_URL="${{ inputs.url }}" node render.js || true

      - name: Upload rendered HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-output
          path: |
            raw.html
            rendered.html
          if-no-files-found: ignore
          retention-days: 3
