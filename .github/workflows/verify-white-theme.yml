name: Diagnostic - verify white theme (3D scenes + pages)
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.47.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Serve site
        run: |
          npx http-server -p 8080 . &
          sleep 2

      - name: Run check
        run: |
          cat > check.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push('PAGEERROR: ' + err.message));

            await page.goto('http://localhost:8080/index.html', { waitUntil: 'domcontentloaded', timeout: 60000 });

            const ferrariSection = await page.$('#processus3d');
            const ferrariBox = await ferrariSection.boundingBox();
            const igSection = await page.$('#instagram3d');
            const igBox = await igSection.boundingBox();

            // Ferrari (no bloom) at a mid checkpoint
            await page.evaluate((y) => window.scrollTo(0, y), ferrariBox.y + ferrariBox.height * 0.3);
            await page.waitForFunction(() => {
              const l = document.querySelector('#processus3d .showcase3d-loading');
              return l && (l.classList.contains('is-hidden') || l.classList.contains('is-error'));
            }, { timeout: 45000 }).catch(() => console.log('FERRARI_LOAD_TIMEOUT'));
            await page.waitForTimeout(800);
            const ferrariState = await page.evaluate(() => {
              const l = document.querySelector('#processus3d .showcase3d-loading');
              return { hidden: l.classList.contains('is-hidden'), error: l.classList.contains('is-error') };
            });
            console.log('FERRARI_STATE', JSON.stringify(ferrariState));
            await page.screenshot({ path: '/tmp/white_ferrari.jpg', type: 'jpeg', quality: 65 });

            // Porsche (bloom) — rear view (taillight) and near-final zoom (headlight glow + background check)
            await page.evaluate((y) => window.scrollTo(0, y), igBox.y);
            await page.waitForFunction(() => {
              const l = document.querySelector('#instagram3d .showcase3d-loading');
              return l && (l.classList.contains('is-hidden') || l.classList.contains('is-error'));
            }, { timeout: 60000 }).catch(() => console.log('PORSCHE_LOAD_TIMEOUT'));
            await page.waitForTimeout(800);
            const porscheState = await page.evaluate(() => {
              const l = document.querySelector('#instagram3d .showcase3d-loading');
              return { hidden: l.classList.contains('is-hidden'), error: l.classList.contains('is-error') };
            });
            console.log('PORSCHE_STATE', JSON.stringify(porscheState));
            await page.screenshot({ path: '/tmp/white_porsche_rear.jpg', type: 'jpeg', quality: 65 });

            const scrollable = igBox.height - 900;
            await page.evaluate((y) => window.scrollTo(0, y), igBox.y + scrollable * 0.92);
            await page.waitForTimeout(900);
            await page.screenshot({ path: '/tmp/white_porsche_zoom.jpg', type: 'jpeg', quality: 65 });

            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors));
            await browser.close();
          })();
          EOF
          node check.js

      - name: Print thumbnails as base64
        if: always()
        run: |
          for f in /tmp/white_ferrari.jpg /tmp/white_porsche_rear.jpg /tmp/white_porsche_zoom.jpg; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              base64 -w 0 "$f"
              echo ""
            fi
          done
