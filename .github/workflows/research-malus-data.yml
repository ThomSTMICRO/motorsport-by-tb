name: Research malus/carte grise official data

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Capture full /fields JSON and inspect its structure
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            let savedAny = false;
            let counter = 0;

            page.on('response', async (res) => {
              if (res.url().includes('/Default/fields') || res.url().includes('/Default/source')) {
                try {
                  const body = await res.text();
                  counter++;
                  const fname = res.url().includes('fields') ? `fields_full_${counter}.json` : `source_${counter}.json`;
                  fs.writeFileSync(fname, body);
                  console.log('SAVED', fname, 'bytes:', body.length, 'url:', res.url());
                  savedAny = true;
                } catch (e) { console.log('capture error', e.message); }
              }
            });

            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);

            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

            // Step 1: démarche + franceOuImport
            await page.selectOption('#demarche', { label: "Immatriculation d'un véhicule d'occasion" }).catch(()=>{});
            await page.waitForTimeout(800);
            const franceOuImportImporte = await page.$('#franceOuImport_2');
            if (franceOuImportImporte) { await franceOuImportImporte.click().catch(()=>{}); }
            await page.waitForTimeout(800);

            // Try clicking "Suivant" robustly: re-query fresh each attempt, use force if needed
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const btn = page.locator('button:has-text("Suivant"), button:has-text("Continuer"), button:has-text("Valider")').first();
                await btn.waitFor({ state: 'visible', timeout: 3000 });
                await btn.click({ timeout: 3000, force: true });
                console.log('CLICKED NEXT on attempt', attempt);
                break;
              } catch (e) {
                console.log('attempt', attempt, 'failed:', e.message.split('\n')[0]);
                await page.waitForTimeout(700);
              }
            }
            await page.waitForTimeout(1500);

            console.log('=== VISIBLE TEXT AFTER STEP ATTEMPT ===');
            console.log((await page.evaluate(() => document.body.innerText)).slice(0, 2000));

            await page.screenshot({ path: 'step_after.png', fullPage: true });

            // Now inspect the structure of every captured fields/source JSON file
            const files = fs.readdirSync('.').filter(f => f.startsWith('fields_full_') || f.startsWith('source_'));
            for (const f of files) {
              try {
                const raw = fs.readFileSync(f, 'utf8');
                const json = JSON.parse(raw);
                console.log('=== STRUCTURE OF', f, '===');
                const summarize = (obj, depth) => {
                  if (depth > 2 || obj === null || typeof obj !== 'object') return;
                  if (Array.isArray(obj)) {
                    console.log('  '.repeat(depth) + `[array of ${obj.length}]`);
                    if (obj.length) summarize(obj[0], depth + 1);
                  } else {
                    for (const k of Object.keys(obj)) {
                      const v = obj[k];
                      const t = Array.isArray(v) ? `array(${v.length})` : typeof v;
                      console.log('  '.repeat(depth) + k + ': ' + t);
                    }
                  }
                };
                summarize(json, 0);
              } catch (e) {
                console.log(f, 'not valid JSON or error:', e.message);
              }
            }

            // Keyword grep across all captured files for tax-relevant terms
            const keywords = ['malus', 'co2', 'poids', 'departement', 'région', 'region', 'cheval', 'tarif', 'bareme', 'barème', 'taxe', 'coefficient', 'masse', 'énergie', 'energie'];
            for (const f of files) {
              const raw = fs.readFileSync(f, 'utf8').toLowerCase();
              for (const kw of keywords) {
                if (raw.includes(kw)) console.log('KEYWORD HIT:', f, kw);
              }
            }

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-full
          path: |
            fields_full_*.json
            source_*.json
            step_after.png
