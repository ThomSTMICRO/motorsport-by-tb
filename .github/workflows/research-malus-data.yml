name: Research malus/carte grise official data

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Capture fields/source JSON and dump relevant rules
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            let counter = 0;

            page.on('response', async (res) => {
              if (res.url().includes('/Default/fields') || res.url().includes('/Default/source')) {
                try {
                  const body = await res.text();
                  counter++;
                  const fname = res.url().includes('fields') ? `fields_full_${counter}.json` : `source_${counter}.json`;
                  fs.writeFileSync(fname, body);
                  console.log('SAVED', fname, 'bytes:', body.length, 'url:', res.url());
                } catch (e) { console.log('capture error', e.message); }
              }
            });

            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}
            await page.selectOption('#demarche', { label: "Immatriculation d'un véhicule d'occasion" }).catch(()=>{});
            await page.waitForTimeout(800);
            const franceOuImportImporte = await page.$('#franceOuImport_2');
            if (franceOuImportImporte) { await franceOuImportImporte.click().catch(()=>{}); }
            await page.waitForTimeout(1500);
            await browser.close();

            console.log('\n\n=== RAW CONTENT OF SMALL source_*.json FILES ===');
            const files = fs.readdirSync('.').filter(f => f.startsWith('fields_full_') || f.startsWith('source_'));
            for (const f of files.filter(f => f.startsWith('source_'))) {
              console.log('--- ' + f + ' ---');
              console.log(fs.readFileSync(f, 'utf8'));
            }

            const keywords = ['malus','co2','poids','departement','région','region','cheval','tarif','bareme','barème','taxe','coefficient','masse','énergie','energie','abattement','plafond','seuil','tmom','regional','régional'];
            for (const f of files.filter(f => f.startsWith('fields_full_'))) {
              const json = JSON.parse(fs.readFileSync(f, 'utf8'));
              console.log('\n\n=== FIELD-LEVEL INFO FROM ' + f + ' ===');
              console.log('top name/label/category:', json.name, '|', json.label, '|', json.category);
              console.log('step:', JSON.stringify(json.step).slice(0,1000));
              console.log('sources keys:', JSON.stringify(Object.keys(json.sources || {})));
              console.log('datas keys:', JSON.stringify(Object.keys(json.datas || {})).slice(0,2000));

              const rules = json.rules || [];
              console.log('TOTAL RULES:', rules.length);
              const matched = rules.filter(r => {
                const blob = JSON.stringify(r).toLowerCase();
                return keywords.some(k => blob.includes(k));
              });
              console.log('MATCHED RULES:', matched.length, '/ ', rules.length);
              matched.forEach((r, i) => {
                console.log(`--- RULE ${i} ---`);
                console.log(JSON.stringify(r, null, 1));
              });
            }
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-full
          path: |
            fields_full_*.json
            source_*.json
