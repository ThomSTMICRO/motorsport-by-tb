name: Research malus/carte grise official data

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the simulator's fields JSON in full
        run: |
          curl -sL -A "Mozilla/5.0" "https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation/Default/fields" -o fields.json
          echo "bytes: $(wc -c < fields.json)"
          python3 -m json.tool fields.json > fields_pretty.json || cp fields.json fields_pretty.json
          echo "=== first 3000 chars pretty ==="
          head -c 3000 fields_pretty.json
          echo ""
          echo "=== search for key terms ==="
          grep -o '"[a-zA-Z][a-zA-Z0-9_]\{2,40\}"[[:space:]]*:' fields.json | sort -u | head -150

      - name: Upload full fields json
        uses: actions/upload-artifact@v4
        with:
          name: fields-json
          path: fields_pretty.json
