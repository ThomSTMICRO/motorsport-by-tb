name: Research malus/carte grise official data

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: List all form controls after démarche+import selected
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}
            await page.selectOption('#demarche', { label: "Immatriculation d'un véhicule d'occasion" }).catch(()=>{});
            await page.waitForTimeout(800);
            const franceOuImportImporte = await page.$('#franceOuImport_2');
            if (franceOuImportImporte) { await franceOuImportImporte.click().catch(()=>{}); }
            await page.waitForTimeout(1500);

            const controls = await page.evaluate(() => {
              function labelFor(el) {
                if (el.id) {
                  const lbl = document.querySelector(`label[for="${CSS.escape(el.id)}"]`);
                  if (lbl) return lbl.innerText.trim().slice(0,120);
                }
                const fieldset = el.closest('fieldset');
                if (fieldset) {
                  const legend = fieldset.querySelector('legend');
                  if (legend) return legend.innerText.trim().slice(0,120);
                }
                const prevLabel = el.parentElement && el.parentElement.querySelector('label');
                if (prevLabel) return prevLabel.innerText.trim().slice(0,120);
                return null;
              }
              const els = Array.from(document.querySelectorAll('input, select, textarea'));
              return els.map(el => ({
                tag: el.tagName,
                type: el.type || null,
                id: el.id || null,
                name: el.name || null,
                visible: !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length),
                label: labelFor(el),
                options: el.tagName === 'SELECT' ? Array.from(el.options).slice(0,6).map(o => o.value + '=' + o.text) : undefined
              }));
            });
            console.log('TOTAL_CONTROLS', controls.length);
            console.log(JSON.stringify(controls, null, 0));

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
