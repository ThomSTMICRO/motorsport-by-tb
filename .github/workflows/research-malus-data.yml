name: Research malus/carte grise official data

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Capture fields JSON
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            page.on('response', async (res) => {
              if (res.url().includes('/Default/fields')) {
                try { fs.writeFileSync('fields_full_1.json', await res.text()); } catch (e) {}
              }
            });
            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}
            await page.selectOption('#demarche', { label: "Immatriculation d'un véhicule d'occasion" }).catch(()=>{});
            await page.waitForTimeout(800);
            const franceOuImportImporte = await page.$('#franceOuImport_2');
            if (franceOuImportImporte) { await franceOuImportImporte.click().catch(()=>{}); }
            await page.waitForTimeout(1500);
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF

      - name: Print step.json and datas.json in chunks
        run: |
          node -e "
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync('fields_full_1.json', 'utf8'));
          const CH = 6000;
          function dump(label, obj) {
            const s = JSON.stringify(obj, null, 1);
            console.log('#####', label, 'LENGTH', s.length, '#####');
            for (let i = 0; i < s.length; i += CH) {
              console.log('==='+label+'_CHUNK_' + (i/CH) + '_START===');
              console.log(s.slice(i, i+CH));
              console.log('==='+label+'_CHUNK_' + (i/CH) + '_END===');
            }
          }
          dump('STEP', json.step || {});
          dump('DATAS', json.datas || {});
          // DATAS printed last on purpose: if job log output gets truncated
          // (tail kept), we still get the field-level lookup tables.
          "

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-full
          path: |
            fields_full_*.json
