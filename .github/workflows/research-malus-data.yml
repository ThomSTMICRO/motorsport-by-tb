name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Probe published CO2 malus grid pages
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();

            async function probe(name, url) {
              console.log('\n\n======== PROBE: ' + name + ' (' + url + ') ========');
              const page = await browser.newPage({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
              try {
                const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
                console.log('HTTP status:', res ? res.status() : 'no response');
                await page.waitForTimeout(2500);
                const title = await page.title();
                console.log('Title:', title);
                const bodyText = await page.evaluate(() => document.body.innerText);
                const challenged = /just a moment|checking your browser|verify you are human|cloudflare/i.test(bodyText) || /just a moment/i.test(title);
                console.log('Bot-challenged:', challenged, 'body length:', bodyText.length);

                // Try to find a table with CO2 -> malus mapping
                const tables = await page.evaluate(() => {
                  const out = [];
                  document.querySelectorAll('table').forEach((t, i) => {
                    const rows = Array.from(t.querySelectorAll('tr')).slice(0, 5).map(tr =>
                      Array.from(tr.querySelectorAll('th,td')).map(c => c.textContent.trim()).join(' | ')
                    );
                    out.push({ index: i, rowCount: t.querySelectorAll('tr').length, sample: rows });
                  });
                  return out;
                });
                console.log('TABLES FOUND:', tables.length);
                tables.forEach(t => { console.log('table#' + t.index, 'rows=' + t.rowCount); t.sample.forEach(r => console.log('  ' + r)); });

                console.log('BODY TEXT SAMPLE (2000 chars):');
                console.log(bodyText.slice(0, 2000));
              } catch (e) {
                console.log('PROBE_ERROR', e.message.split('\n')[0]);
              }
              await page.close();
            }

            await probe('malus-ecologique-grille', 'https://www.malus-ecologique.fr/grille-malus/2026');
            await probe('simulateur-malus-bareme', 'https://www.simulateur-malus-ecologique.fr/bareme-malus-ecologique-2026');

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
