name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Walk DOM ancestors to find exactly what hides franceOuImport_2
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1600, height: 5000 } });

            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

            await page.selectOption('#demarche', { label: "Immatriculation d'un véhicule d'occasion" });
            await page.waitForTimeout(1500);

            const chain = await page.evaluate(() => {
              const out = [];
              let el = document.getElementById('franceOuImport_2');
              let depth = 0;
              while (el && depth < 15) {
                const cs = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                out.push({
                  depth,
                  tag: el.tagName,
                  id: el.id || null,
                  cls: el.className || null,
                  display: cs.display,
                  visibility: cs.visibility,
                  opacity: cs.opacity,
                  height: cs.height,
                  maxHeight: cs.maxHeight,
                  overflow: cs.overflow,
                  position: cs.position,
                  rectW: r.width,
                  rectH: r.height,
                });
                el = el.parentElement;
                depth++;
              }
              return out;
            });
            console.log('ANCESTOR_CHAIN:');
            chain.forEach(c => console.log(JSON.stringify(c)));

            // Also compare against typeVehicule (which DOES work) for reference
            const chain2 = await page.evaluate(() => {
              const out = [];
              let el = document.getElementById('typeVehicule');
              let depth = 0;
              while (el && depth < 10) {
                const cs = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                out.push({ depth, tag: el.tagName, id: el.id || null, cls: el.className || null, display: cs.display, visibility: cs.visibility, rectW: r.width, rectH: r.height });
                el = el.parentElement;
                depth++;
              }
              return out;
            });
            console.log('REFERENCE_CHAIN (typeVehicule, known-working):');
            chain2.forEach(c => console.log(JSON.stringify(c)));

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
