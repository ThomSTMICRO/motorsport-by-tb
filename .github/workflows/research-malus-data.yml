name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Sweep every CO2 value through the official simulator (one session)
        timeout-minutes: 8
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1600, height: 3000 } });

            async function forceUnhideOnly(id) {
              return page.evaluate((elId) => {
                const el = document.getElementById(elId);
                if (!el) return 'NO_EL';
                let node = el, changed = [];
                for (let i = 0; i < 6 && node; i++) {
                  const cs = getComputedStyle(node);
                  if (cs.display === 'none') { node.style.display = 'block'; changed.push(node.id || node.className); }
                  node = node.parentElement;
                }
                return changed.join(',') || 'NONE_HIDDEN';
              }, id);
            }

            async function set(id, value, isSelect) {
              try {
                await forceUnhideOnly(id);
                if (isSelect) await page.selectOption('#'+id, {label: value}, {timeout: 5000}).catch(() => page.selectOption('#'+id, value, {timeout: 5000}));
                else await page.fill('#'+id, value, {force: true, timeout: 5000});
                await page.waitForTimeout(300);
                return true;
              } catch (e) { console.log('SET_FAIL', id, e.message.split('\n')[0]); return false; }
            }

            async function forceUnhideAndClick(inputId) {
              await forceUnhideOnly(inputId);
              await page.waitForTimeout(150);
              try { await page.click(`label[for="${inputId}"]`, { timeout: 3000 }); return true; }
              catch (e) { console.log('CLICK_FAIL', inputId, e.message.split('\n')[0]); return false; }
            }

            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

            await set('demarche', "Immatriculation d'un véhicule d'occasion", true);
            await page.waitForTimeout(800);
            await forceUnhideAndClick('franceOuImport_2');
            await page.waitForTimeout(600);
            await set('typeVehicule', 'Véhicule de tourisme (VT ou M1) ex-Voiture particulière (VP)', true);
            await page.waitForTimeout(500);
            // Very recent registration to minimize décote (coef ~1) so we isolate the raw barème.
            await set('dateMiseEnCirculation', '2026-09-01', false);
            await set('PuissanceAdmSaisie', '6', false);
            await page.waitForTimeout(500);
            await forceUnhideAndClick('vehiculeElectric_2');
            await page.waitForTimeout(600);
            await set('energie', 'Essence (ES)', true);
            await page.waitForTimeout(500);
            for (const id of ['Autonomie50Km_2','invalidite_2','receptionCommunautaire_2','vehicule_8Places_2','PersonMoraleLocataireOuProprietaire_2','personneMorale_2']) {
              await forceUnhideAndClick(id);
              await page.waitForTimeout(200);
            }
            // Weight fixed just under the 1500kg threshold: isolates CO2 malus, zero TMOM.
            await set('poidsSaisi', '1400', false);
            await set('departement', '06 - Alpes-Maritimes', true);
            await page.waitForTimeout(1000);

            // --- First value (known-working path) ---
            await page.fill('#TauxCO2Saisi', '105', { force: true, timeout: 4000 });
            await page.waitForTimeout(250);
            await page.click('button:has-text("Afficher le résultat")', { timeout: 4000 });
            await page.waitForTimeout(450);
            let txt = await page.evaluate(() => document.body.innerText);
            let m = txt.match(/Y3\s*-\s*Malus CO2 et TMOM\s*:\s*([\d\s]+,\d+)\s*€/);
            const results = { '105': m ? m[1].replace(/\s/g, '') : 'NOT_FOUND' };
            console.log('105 =>', results['105']);

            // --- Diagnose post-result page state ---
            console.log('=== POST_RESULT_DIAGNOSTICS ===');
            console.log('URL:', page.url());
            const fieldExists = await page.evaluate(() => !!document.getElementById('TauxCO2Saisi'));
            console.log('TauxCO2Saisi still in DOM:', fieldExists);
            const fieldVisible = await page.evaluate(() => {
              const el = document.getElementById('TauxCO2Saisi');
              if (!el) return 'NO_EL';
              const cs = getComputedStyle(el);
              return cs.display + '/' + cs.visibility;
            });
            console.log('TauxCO2Saisi display/visibility:', fieldVisible);
            const clickables = await page.evaluate(() => {
              return Array.from(document.querySelectorAll('button, a')).map(e => e.textContent.trim()).filter(t => t.length > 0 && t.length < 60);
            });
            console.log('Clickable texts on page:', JSON.stringify(clickables));

            // --- Try recovery strategies ---
            let recovered = false;
            const modifyEl = clickables.find(t => /modifier/i.test(t));
            if (modifyEl) {
              console.log('Trying: click element containing "modifier" =>', modifyEl);
              try {
                await page.click(`text="${modifyEl}"`, { timeout: 3000 });
                await page.waitForTimeout(500);
                const vis = await forceUnhideOnly('TauxCO2Saisi');
                console.log('After modify-click, forceUnhideOnly result:', vis);
                const stillThere = await page.evaluate(() => !!document.getElementById('TauxCO2Saisi'));
                console.log('Field present after modify-click:', stillThere);
                if (stillThere) recovered = 'modify-click';
              } catch (e) { console.log('modify-click failed:', e.message.split('\n')[0]); }
            }
            if (!recovered) {
              console.log('Trying: page.goBack()');
              try {
                await page.goBack({ timeout: 5000, waitUntil: 'networkidle' });
                await page.waitForTimeout(500);
                const vis = await forceUnhideOnly('TauxCO2Saisi');
                console.log('After goBack, forceUnhideOnly result:', vis);
                const stillThere = await page.evaluate(() => !!document.getElementById('TauxCO2Saisi'));
                console.log('Field present after goBack:', stillThere);
                if (stillThere) recovered = 'goBack';
              } catch (e) { console.log('goBack failed:', e.message.split('\n')[0]); }
            }
            if (recovered) {
              console.log('Trying test fill with co2=150 after recovery method:', recovered);
              try {
                await forceUnhideOnly('TauxCO2Saisi');
                await page.fill('#TauxCO2Saisi', '150', { force: true, timeout: 4000 });
                await page.waitForTimeout(250);
                await page.click('button:has-text("Afficher le résultat")', { timeout: 4000 });
                await page.waitForTimeout(450);
                txt = await page.evaluate(() => document.body.innerText);
                m = txt.match(/Y3\s*-\s*Malus CO2 et TMOM\s*:\s*([\d\s]+,\d+)\s*€/);
                console.log('150 (after recovery) =>', m ? m[1] : 'NOT_FOUND');
              } catch (e) { console.log('test fill after recovery failed:', e.message.split('\n')[0]); }
            } else {
              console.log('NO RECOVERY METHOD WORKED. Dumping full body text for manual inspection:');
              console.log(txt.slice(0, 3000));
            }

            console.log('=== CO2_SWEEP_RESULTS ===');
            console.log(JSON.stringify(results));
            fs.writeFileSync('co2_sweep.json', JSON.stringify(results, null, 1));

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co2-sweep
          path: co2_sweep.json
