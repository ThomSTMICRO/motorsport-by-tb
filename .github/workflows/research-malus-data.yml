name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Verify franceOuImport radio actually toggles
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

            await page.selectOption('#demarche', "Immatriculation d'un véhicule d'occasion");
            await page.waitForTimeout(1000);

            const before = await page.evaluate(() => ({
              r1: document.getElementById('franceOuImport_1') ? document.getElementById('franceOuImport_1').checked : 'NO_EL',
              r2: document.getElementById('franceOuImport_2') ? document.getElementById('franceOuImport_2').checked : 'NO_EL',
            }));
            console.log('BEFORE:', JSON.stringify(before));

            // Method A: Playwright's dedicated check() with force
            try {
              await page.check('#franceOuImport_2', { force: true, timeout: 3000 });
              console.log('page.check() succeeded without throwing');
            } catch (e) { console.log('page.check() failed:', e.message.split('\n')[0]); }

            const afterA = await page.evaluate(() => ({
              r1: document.getElementById('franceOuImport_1').checked,
              r2: document.getElementById('franceOuImport_2').checked,
            }));
            console.log('AFTER page.check():', JSON.stringify(afterA));

            // If still not checked, try clicking the parent wrapper / sibling span (custom-styled radio pattern)
            if (!afterA.r2) {
              const wrapperInfo = await page.evaluate(() => {
                const el = document.getElementById('franceOuImport_2');
                const parent = el.parentElement;
                return {
                  parentTag: parent ? parent.tagName : null,
                  parentClass: parent ? parent.className : null,
                  parentHTML: parent ? parent.outerHTML.slice(0, 500) : null,
                  grandParentHTML: parent && parent.parentElement ? parent.parentElement.outerHTML.slice(0, 800) : null,
                };
              });
              console.log('WRAPPER_INFO:', JSON.stringify(wrapperInfo));

              try {
                await page.click('#franceOuImport_2 + label, label[for="franceOuImport_2"], #franceOuImport_2 ~ label', { force: true, timeout: 3000 });
              } catch (e) { console.log('sibling label click failed:', e.message.split('\n')[0]); }
              const afterB = await page.evaluate(() => ({
                r1: document.getElementById('franceOuImport_1').checked,
                r2: document.getElementById('franceOuImport_2').checked,
              }));
              console.log('AFTER sibling-label click:', JSON.stringify(afterB));
            }

            await page.screenshot({ path: 'radio_state.png', fullPage: true });
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radio-diag
          path: radio_state.png
