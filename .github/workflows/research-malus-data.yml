name: Research malus/carte grise official data

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Capture fields JSON
        timeout-minutes: 3
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            let counter = 0;
            page.on('response', async (res) => {
              if (res.url().includes('/Default/fields') || res.url().includes('/Default/source')) {
                try {
                  const body = await res.text();
                  counter++;
                  const fname = res.url().includes('fields') ? `fields_full_${counter}.json` : `source_${counter}.json`;
                  fs.writeFileSync(fname, body);
                } catch (e) {}
              }
            });
            await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}
            await page.selectOption('#demarche', { label: "Immatriculation d'un véhicule d'occasion" }).catch(()=>{});
            await page.waitForTimeout(800);
            const franceOuImportImporte = await page.$('#franceOuImport_2');
            if (franceOuImportImporte) { await franceOuImportImporte.click().catch(()=>{}); }
            await page.waitForTimeout(1500);
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
          ls -la *.json

      - name: Split evaluate field into files (avoid log truncation)
        run: |
          node <<'EOF'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync('fields_full_1.json', 'utf8'));
          fs.writeFileSync('evaluate.txt', json.evaluate || '');
          fs.writeFileSync('datas.json', JSON.stringify(json.datas || {}, null, 1));
          fs.writeFileSync('step.json', JSON.stringify(json.step || {}, null, 1));
          console.log('evaluate length:', (json.evaluate||'').length);
          console.log('datas length:', JSON.stringify(json.datas||{}).length);
          console.log('step length:', JSON.stringify(json.step||{}).length);
          EOF

      - name: Print evaluate.txt in chunks (chunk markers for easy reassembly)
        run: |
          node -e "
          const fs = require('fs');
          const s = fs.readFileSync('evaluate.txt', 'utf8');
          const CH = 6000;
          for (let i = 0; i < s.length; i += CH) {
            console.log('===CHUNK ' + (i/CH) + ' START===');
            console.log(s.slice(i, i+CH));
            console.log('===CHUNK ' + (i/CH) + ' END===');
          }
          "

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-full
          path: |
            fields_full_*.json
            source_*.json
            evaluate.txt
            datas.json
            step.json
