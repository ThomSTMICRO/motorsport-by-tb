name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  q5_scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Real Audi Q5 2018 252ch import scenario via official simulator
        timeout-minutes: 5
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1600, height: 3000 } });

            async function forceUnhideOnly(id) {
              return page.evaluate((elId) => {
                const el = document.getElementById(elId);
                if (!el) return 'NO_EL';
                let node = el, changed = [];
                for (let i = 0; i < 6 && node; i++) {
                  const cs = getComputedStyle(node);
                  if (cs.display === 'none') { node.style.display = 'block'; changed.push(node.id || node.className); }
                  node = node.parentElement;
                }
                return changed.join(',') || 'NONE_HIDDEN';
              }, id);
            }
            async function set(id, value, isSelect) {
              try {
                await forceUnhideOnly(id);
                if (isSelect) await page.selectOption('#'+id, {label: value}, {timeout: 5000}).catch(() => page.selectOption('#'+id, value, {timeout: 5000}));
                else await page.fill('#'+id, value, {force: true, timeout: 5000});
                await page.waitForTimeout(300);
                return true;
              } catch (e) { console.log('SET_FAIL', id, e.message.split('\n')[0]); return false; }
            }
            async function forceUnhideAndClick(inputId) {
              await forceUnhideOnly(inputId);
              await page.waitForTimeout(150);
              try { await page.click(`label[for="${inputId}"]`, { timeout: 3000 }); return true; }
              catch (e) { console.log('CLICK_FAIL', inputId, e.message.split('\n')[0]); return false; }
            }

            async function runScenario(label, {dateMEC, cv, co2, poids, dept}) {
              console.log('\n\n======== SCENARIO: ' + label + ' ========');
              await page.goto('https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation', { waitUntil: 'networkidle', timeout: 45000 });
              await page.waitForTimeout(1000);
              try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

              await set('demarche', "Immatriculation d'un véhicule d'occasion", true);
              await page.waitForTimeout(800);
              await forceUnhideAndClick('franceOuImport_2'); // importé
              await page.waitForTimeout(600);
              await set('typeVehicule', 'Véhicule de tourisme (VT ou M1) ex-Voiture particulière (VP)', true);
              await page.waitForTimeout(500);
              await set('dateMiseEnCirculation', dateMEC, false);
              await set('PuissanceAdmSaisie', String(cv), false);
              await page.waitForTimeout(500);
              await forceUnhideAndClick('vehiculeElectric_2'); // non électrique
              await page.waitForTimeout(600);
              await set('energie', 'Essence (ES)', true);
              await page.waitForTimeout(500);
              for (const id of ['Autonomie50Km_2','invalidite_2','receptionCommunautaire_2','vehicule_8Places_2','PersonMoraleLocataireOuProprietaire_2','personneMorale_2']) {
                await forceUnhideAndClick(id);
                await page.waitForTimeout(200);
              }
              await set('poidsSaisi', String(poids), false);
              await page.waitForTimeout(300);
              await forceUnhideOnly('TauxCO2Saisi');
              await page.fill('#TauxCO2Saisi', String(co2), { force: true, timeout: 5000 });
              await page.waitForTimeout(300);
              await set('departement', dept, true);
              await page.waitForTimeout(1000);

              await page.click('button:has-text("Afficher le résultat")', { timeout: 8000 });
              await page.waitForTimeout(700);
              const txt = await page.evaluate(() => document.body.innerText);
              const lines = txt.split('\n').filter(l => /^Y[1-6]\s*-/.test(l.trim()) || /Total/i.test(l.trim()));
              console.log('RESULT LINES:');
              lines.forEach(l => console.log('  ', l.trim()));
              // Dump broader results block as fallback in case regex above misses formatting
              const idx = txt.indexOf('Y1');
              if (idx >= 0) console.log('RAW BLOCK:\n', txt.slice(idx, idx + 1200));
            }

            // Audi Q5 II (FY) facelift "45 TFSI quattro" 2.0 TFSI 252ch, MY2018, essence, import Allemagne.
            // Specs ESTIMÉES (à confirmer avec la carte grise allemande / COC réelle) :
            //   CO2 ~172 g/km (NEDC corrélé), masse en ordre de marche ~1900kg, puissance fiscale ~12 CV.
            //   Département placeholder: 06 - Alpes-Maritimes (à remplacer par le département réel du client).
            await runScenario('Audi Q5 2018 252ch essence import (estimations)', {
              dateMEC: '2018-06-01', cv: 12, co2: 172, poids: 1900, dept: '06 - Alpes-Maritimes'
            });

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
