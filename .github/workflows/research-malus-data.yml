name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  fetch_tarifs_regionaux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Fetch full 2026 regional cheval fiscal tariff table
        timeout-minutes: 4
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            async function probe(url) {
              console.log('\n\n======== FETCH: ' + url + ' ========');
              const page = await browser.newPage({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
              try {
                const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 25000 });
                console.log('HTTP status:', res ? res.status() : 'no response');
                await page.waitForTimeout(1500);
                // Dump all table rows as text (departement/region tables are usually <table> or list items)
                const rows = await page.evaluate(() => {
                  const out = [];
                  document.querySelectorAll('table tr').forEach(tr => {
                    const cells = Array.from(tr.querySelectorAll('td,th')).map(td => td.textContent.trim());
                    if (cells.length) out.push(cells.join(' | '));
                  });
                  return out;
                });
                console.log('TABLE ROWS (' + rows.length + '):');
                rows.forEach(r => console.log('  ', r));
                if (rows.length === 0) {
                  const txt = await page.evaluate(() => document.body.innerText);
                  console.log('NO TABLE FOUND. Full text (8000 chars):\n', txt.slice(0, 8000));
                }
              } catch (e) {
                console.log('FETCH_ERROR', e.message.split('\n')[0]);
              }
              await page.close();
            }
            await probe('https://www.direct-carte-grise.fr/aide/tarif-carte-grise-2026');
            await probe('https://www.caroom.fr/guide/administratif/carte-grise/prix-cheval-fiscal');
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
