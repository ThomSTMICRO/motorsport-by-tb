name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  fetch_legifrance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Fetch Legifrance article L421-7-2 (décote coefficient) full text
        timeout-minutes: 4
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            async function probe(url) {
              console.log('\n\n======== FETCH: ' + url + ' ========');
              const page = await browser.newPage({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
              try {
                const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 25000 });
                console.log('HTTP status:', res ? res.status() : 'no response');
                await page.waitForTimeout(1500);
                const txt = await page.evaluate(() => document.body.innerText);
                console.log('FULL TEXT (up to 6000 chars):\n', txt.slice(0, 6000));
              } catch (e) {
                console.log('FETCH_ERROR', e.message.split('\n')[0]);
              }
              await page.close();
            }
            await probe('https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051180735');
            await probe('https://www.legifrance.gouv.fr/codes/id/LEGISCTA000051180737');
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
