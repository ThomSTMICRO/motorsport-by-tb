name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  fetch_bofip_full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Fetch full BOI-AIS-MOB-10-20-40 text, searching for "coefficient forfaitaire" / "ancienneté" / "importé"
        timeout-minutes: 4
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
            const url = 'https://bofip.impots.gouv.fr/bofip/13927-PGP.html/identifiant=BOI-AIS-MOB-10-20-40-20250528';
            const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 25000 });
            console.log('HTTP status:', res ? res.status() : 'no response');
            await page.waitForTimeout(1500);
            const txt = await page.evaluate(() => document.body.innerText);
            console.log('FULL TEXT LENGTH:', txt.length);

            for (const kw of ['coefficient forfaitaire', 'ancienneté', 'importé', 'décote', 'usagé', 'occasion']) {
              const positions = [];
              let idx = txt.toLowerCase().indexOf(kw.toLowerCase());
              while (idx >= 0 && positions.length < 3) {
                positions.push(idx);
                idx = txt.toLowerCase().indexOf(kw.toLowerCase(), idx + 1);
              }
              console.log(`Keyword "${kw}": ${positions.length} occurrence(s) at positions`, positions);
            }

            console.log('\n=== FULL TEXT (complete) ===\n');
            console.log(txt);

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
