name: Research malus/carte grise official data

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-malus-data.yml]

jobs:
  fetch_bofip_decote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Fetch BOFiP pages searching for the exact décote coefficient table
        timeout-minutes: 5
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            async function probe(url) {
              console.log('\n\n======== FETCH: ' + url + ' ========');
              const page = await browser.newPage({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
              try {
                const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 25000 });
                console.log('HTTP status:', res ? res.status() : 'no response');
                await page.waitForTimeout(1500);
                const txt = await page.evaluate(() => document.body.innerText);
                console.log('FULL TEXT LENGTH:', txt.length);
                const lower = txt.toLowerCase();
                const idx = lower.indexOf('coefficient forfaitaire de décote');
                const idx2 = idx >= 0 ? idx : lower.indexOf('décote');
                if (idx2 >= 0) {
                  console.log('CONTEXT (10000 chars):\n', txt.slice(Math.max(0, idx2 - 300), idx2 + 10000));
                } else {
                  console.log('"décote" not found. Table of contents / headings:');
                  const headings = await page.evaluate(() =>
                    Array.from(document.querySelectorAll('h1,h2,h3,a')).map(e => e.textContent.trim()).filter(t => t.length > 3 && t.length < 150)
                  );
                  console.log(JSON.stringify(headings.slice(0, 100)));
                }
              } catch (e) {
                console.log('FETCH_ERROR', e.message.split('\n')[0]);
              }
              await page.close();
            }
            await probe('https://bofip.impots.gouv.fr/bofip/13925-PGP.html/identifiant=BOI-AIS-MOB-10-20-30-20250528');
            await probe('https://bofip.impots.gouv.fr/bofip/13911-PGP.html/identifiant=BOI-AIS-MOB-10-10-20250604');
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
