name: Research malus bareme by year (2012-2026)

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-bareme-annees.yml]

jobs:
  fetch_baremes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Fetch per-year bareme pages and weight-malus pages
        timeout-minutes: 8
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            async function probe(url) {
              console.log('\n\n======== FETCH: ' + url + ' ========');
              const page = await browser.newPage({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
              try {
                const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 20000 });
                const status = res ? res.status() : 0;
                console.log('HTTP status:', status);
                if (status === 404) { await page.close(); return; }
                await page.waitForTimeout(1200);
                const rows = await page.evaluate(() => {
                  const out = [];
                  document.querySelectorAll('table tr').forEach(tr => {
                    const cells = Array.from(tr.querySelectorAll('td,th')).map(td => td.textContent.trim());
                    if (cells.length) out.push(cells.join(' | '));
                  });
                  return out;
                });
                if (rows.length) {
                  console.log('TABLE ROWS (' + rows.length + '):');
                  rows.forEach(r => console.log('  ', r));
                } else {
                  const txt = await page.evaluate(() => document.body.innerText);
                  console.log('NO TABLE. Body text (first 5000 chars):\n', txt.slice(0, 5000));
                }
              } catch (e) {
                console.log('FETCH_ERROR', e.message.split('\n')[0]);
              }
              await page.close();
            }
            for (const year of [2012,2013,2014,2015,2016,2017,2019,2020,2021,2022,2023,2024,2025]) {
              await probe(`https://www.simulateur-malus-ecologique.fr/bareme-malus-ecologique-${year}`);
            }
            await probe('https://makeamove.fr/simulateur-fiscal-automobile/malus-poids/');
            await probe('https://macalculatriceenligne.com/auto/calcul-malus-ecologique/');
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
