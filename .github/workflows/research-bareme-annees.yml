name: Research malus bareme by year (2012-2026)

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-bareme-annees.yml]

jobs:
  query_source_api_2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Fill remaining years + per-gram refinement for key years + full region table
        timeout-minutes: 12
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const base = 'https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation';

            await page.goto(base, { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

            const csrf = await page.evaluate(() => {
              const el = document.querySelector('input[name="_csrf_token"]');
              return el ? el.value : null;
            });
            if (!csrf) { console.error('NO CSRF TOKEN'); process.exit(1); }
            console.log('CSRF ok');

            const postSource = async (params) => {
              const body = new URLSearchParams({ ...params, _csrf_token: csrf }).toString();
              return page.evaluate(async ({ url, body }) => {
                const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body });
                return { status: res.status, text: await res.text() };
              }, { url: base + '/Default/source', body });
            };

            // --- Missing years, 5g resolution (matches the first successful sweep) ---
            const co2Results = {};
            const anneesManquantes = [2013, 2014, 2016, 2017, 2019, 2021, 2023, 2025];
            for (const annee of anneesManquantes) {
              co2Results[annee] = {};
              for (let co2 = 90; co2 <= 230; co2 += 5) {
                const r = await postSource({ source: '3', annee: String(annee), minCO2: String(co2), maxCO2: String(co2), paramPeriode: '1' });
                co2Results[annee][co2] = r.status === 200 ? r.text : `ERR_${r.status}`;
                await page.waitForTimeout(100);
              }
              console.log(`Done annee=${annee}`);
            }

            // --- Per-gram refinement for the 4 most-used years ---
            const finegrain = {};
            for (const annee of [2018, 2022, 2024, 2026]) {
              finegrain[annee] = {};
              for (let co2 = 90; co2 <= 230; co2 += 1) {
                const r = await postSource({ source: '3', annee: String(annee), minCO2: String(co2), maxCO2: String(co2), paramPeriode: '1' });
                finegrain[annee][co2] = r.status === 200 ? r.text : `ERR_${r.status}`;
                await page.waitForTimeout(100);
              }
              console.log(`Done fine annee=${annee}`);
            }

            fs.writeFileSync('co2_par_annee_2.json', JSON.stringify(co2Results, null, 1));
            fs.writeFileSync('co2_fin.json', JSON.stringify(finegrain, null, 1));

            console.log('\n=== CO2 MANQUANTES ===');
            for (const a of anneesManquantes) console.log(a + ':', JSON.stringify(co2Results[a]));

            console.log('\n=== CO2 FIN (per-gram) ===');
            for (const a of [2018, 2022, 2024, 2026]) console.log(a + ':', JSON.stringify(finegrain[a]));

            // --- Full region table (13 metropolitan + a couple overseas), with annee param this time ---
            const codesRegion = { '11':'IDF','24':'Centre-Val de Loire','27':'Bourgogne-Franche-Comte','28':'Normandie','32':'Hauts-de-France','44':'Grand Est','52':'Pays de la Loire','53':'Bretagne','75':'Nouvelle-Aquitaine','76':'Occitanie','84':'Auvergne-Rhone-Alpes','93':'PACA','94':'Corse' };
            const regionResults = {};
            for (const [code, nom] of Object.entries(codesRegion)) {
              const r = await postSource({ source: '1', paramCodeREgion: code, annee: '2026' });
              regionResults[code] = { nom, reponse: r.status === 200 ? r.text : `ERR_${r.status}` };
              await page.waitForTimeout(100);
            }
            fs.writeFileSync('regions.json', JSON.stringify(regionResults, null, 1));
            console.log('\n=== REGIONS (avec annee=2026) ===');
            console.log(JSON.stringify(regionResults, null, 1));

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareme-source-data-2
          path: |
            co2_par_annee_2.json
            co2_fin.json
            regions.json
