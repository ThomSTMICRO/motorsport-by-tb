name: Research malus bareme by year (2012-2026)

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-bareme-annees.yml]

jobs:
  query_source_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Query /Default/source directly for CO2 (source=3) and poids (source=13) across years
        timeout-minutes: 10
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const base = 'https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation';

            await page.goto(base, { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

            const csrf = await page.evaluate(() => {
              const el = document.querySelector('input[name="_csrf_token"]');
              if (el) return el.value;
              const meta = document.querySelector('meta[name="csrf-token"]');
              return meta ? meta.content : null;
            });
            console.log('CSRF token found:', csrf ? csrf.slice(0, 20) + '...' : 'NONE');
            if (!csrf) { console.error('NO CSRF TOKEN, aborting'); process.exit(1); }

            // Direct POST via fetch() inside the browser context (reuses cookies/session).
            const postSource = async (params) => {
              const body = new URLSearchParams({ ...params, _csrf_token: csrf }).toString();
              return page.evaluate(async ({ url, body }) => {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'content-type': 'application/x-www-form-urlencoded' },
                  body,
                });
                return { status: res.status, text: await res.text() };
              }, { url: base + '/Default/source', body });
            };

            // --- Sanity check: reproduce the known case (2026, CO2=162 -> should relate to 4460-ish scale, NOT 2018's) ---
            const sanity = await postSource({ source: '3', annee: '2026', minCO2: '162', maxCO2: '162', paramPeriode: '1' });
            console.log('SANITY (2026, CO2=162):', JSON.stringify(sanity));

            // --- CO2 malus sweep: proof of concept across several years, moderate resolution first ---
            const co2Results = {};
            const anneesTest = [2012, 2015, 2018, 2020, 2022, 2024, 2026];
            for (const annee of anneesTest) {
              co2Results[annee] = {};
              for (let co2 = 100; co2 <= 220; co2 += 5) {
                const r = await postSource({ source: '3', annee: String(annee), minCO2: String(co2), maxCO2: String(co2), paramPeriode: '1' });
                co2Results[annee][co2] = r.status === 200 ? r.text : `ERR_${r.status}`;
                await page.waitForTimeout(80); // be gentle with the government server
              }
              console.log(`Done annee=${annee}`);
            }
            fs.writeFileSync('co2_par_annee.json', JSON.stringify(co2Results, null, 1));
            console.log('\n=== CO2 RESULTS SAMPLE ===');
            for (const annee of anneesTest) {
              console.log(annee + ':', JSON.stringify(co2Results[annee]));
            }

            // --- Poids malus sweep: 2022-2026 ---
            const poidsResults = {};
            for (const annee of [2022, 2023, 2024, 2025, 2026]) {
              poidsResults[annee] = {};
              for (let poids = 1400; poids <= 2600; poids += 50) {
                const r = await postSource({ source: '13', annee: String(annee), poids: String(poids) });
                poidsResults[annee][poids] = r.status === 200 ? r.text : `ERR_${r.status}`;
                await page.waitForTimeout(80);
              }
              console.log(`Done poids annee=${annee}`);
            }
            fs.writeFileSync('poids_par_annee.json', JSON.stringify(poidsResults, null, 1));
            console.log('\n=== POIDS RESULTS ===');
            for (const annee of Object.keys(poidsResults)) {
              console.log(annee + ':', JSON.stringify(poidsResults[annee]));
            }

            // --- Regional tax lookup (source=1) with a few region codes ---
            const regionResults = {};
            for (const code of ['93','11','84','32']) {
              const r = await postSource({ source: '1', paramCodeREgion: code });
              regionResults[code] = r.status === 200 ? r.text : `ERR_${r.status}`;
              await page.waitForTimeout(80);
            }
            console.log('\n=== REGION RESULTS ===', JSON.stringify(regionResults));

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareme-source-data
          path: |
            co2_par_annee.json
            poids_par_annee.json
