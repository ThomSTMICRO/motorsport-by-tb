name: Research malus bareme by year (2012-2026)

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-bareme-annees.yml]

jobs:
  fetch_baremes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Fetch lunil.com year-by-year retrospective and makeamove.fr full text
        timeout-minutes: 5
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            async function probe(url, dumpChars) {
              console.log('\n\n======== FETCH: ' + url + ' ========');
              const page = await browser.newPage({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
              try {
                const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 25000 });
                console.log('HTTP status:', res ? res.status() : 0);
                await page.waitForTimeout(1500);
                const rows = await page.evaluate(() => {
                  const out = [];
                  document.querySelectorAll('table').forEach((table, i) => {
                    out.push('--- TABLE ' + i + ' ---');
                    table.querySelectorAll('tr').forEach(tr => {
                      const cells = Array.from(tr.querySelectorAll('td,th')).map(td => td.textContent.trim());
                      if (cells.length) out.push(cells.join(' | '));
                    });
                  });
                  return out;
                });
                console.log('TABLES FOUND: ' + rows.filter(r => r.startsWith('--- TABLE')).length);
                rows.forEach(r => console.log('  ', r));
                const txt = await page.evaluate(() => document.body.innerText);
                console.log('FULL BODY TEXT LENGTH:', txt.length);
                console.log('FULL BODY TEXT:\n', txt.slice(0, dumpChars || 3000));
              } catch (e) {
                console.log('FETCH_ERROR', e.message.split('\n')[0]);
              }
              await page.close();
            }
            await probe('https://www.lunil.com/tous-les-malus-ecologiques-annee-par-annee/', 20000);
            await probe('https://makeamove.fr/simulateur-fiscal-automobile/malus-poids/', 8000);
            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
