name: Optimize actualites image

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install imagemagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Resize and compress
        run: |
          cd images/actualites
          ls -la
          identify ferrari-sf90-eze.jpg
          convert ferrari-sf90-eze.jpg -resize 1400x -quality 78 -strip ferrari-sf90-eze-opt.jpg
          ls -la
          identify ferrari-sf90-eze-opt.jpg

      - name: Print optimized file as base64
        run: |
          echo "OPT_START"
          base64 -w0 images/actualites/ferrari-sf90-eze-opt.jpg
          echo ""
          echo "OPT_END"
