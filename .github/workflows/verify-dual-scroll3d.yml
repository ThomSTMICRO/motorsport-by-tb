name: Diagnostic - verify dual scroll3D (Ferrari + Porsche)
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.47.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Serve site
        run: |
          npx http-server -p 8080 . &
          sleep 2

      - name: Run dual scroll3D check
        run: |
          cat > check.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push('PAGEERROR: ' + err.message));

            await page.goto('http://localhost:8080/index.html', { waitUntil: 'networkidle', timeout: 45000 });

            const heroState = await page.evaluate(() => ({
              videoPresent: !!document.querySelector('.hero-video'),
              stage3dPresent: !!document.querySelector('.hero-3d-stage'),
            }));
            console.log('HERO_STATE', JSON.stringify(heroState));

            // Ferrari section (processus3d)
            const ferrariSection = await page.$('#processus3d');
            const ferrariBox = await ferrariSection.boundingBox();
            await page.evaluate((y) => window.scrollTo(0, y), ferrariBox.y + ferrariBox.height/2 - 450);
            await page.waitForTimeout(1500);
            const ferrariState = await page.evaluate(() => {
              const loading = document.querySelector('#processus3d .showcase3d-loading');
              const canvas = document.querySelector('#processus3d canvas');
              const step = document.querySelector('#processus3d .scroll3d-step.is-active');
              return {
                loadingHidden: loading ? loading.classList.contains('is-hidden') : null,
                loadingError: loading ? loading.classList.contains('is-error') : null,
                canvasPresent: !!canvas,
                activeStep: step ? step.dataset.step : null,
              };
            });
            console.log('FERRARI_STATE', JSON.stringify(ferrariState));
            await page.screenshot({ path: '/tmp/dual_ferrari.jpg', type: 'jpeg', quality: 60 });

            // Instagram/Porsche section
            const igSection = await page.$('#instagram3d');
            const igBox = await igSection.boundingBox();
            await page.evaluate((y) => window.scrollTo(0, y), igBox.y + igBox.height * 0.85 - 450);
            await page.waitForTimeout(1500);
            const igState = await page.evaluate(() => {
              const loading = document.querySelector('#instagram3d .showcase3d-loading');
              const canvas = document.querySelector('#instagram3d canvas');
              const step = document.querySelector('#instagram3d .scroll3d-step.is-active');
              const ctaBtn = document.querySelector('#instagram3d .scroll3d-step .btn');
              return {
                loadingHidden: loading ? loading.classList.contains('is-hidden') : null,
                loadingError: loading ? loading.classList.contains('is-error') : null,
                canvasPresent: !!canvas,
                activeStep: step ? step.dataset.step : null,
                ctaBtnPresent: !!ctaBtn,
                ctaBtnText: ctaBtn ? ctaBtn.textContent.trim() : null,
              };
            });
            console.log('INSTA_STATE', JSON.stringify(igState));
            await page.screenshot({ path: '/tmp/dual_insta.jpg', type: 'jpeg', quality: 60 });

            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors));
            await browser.close();
          })();
          EOF
          node check.js

      - name: Print thumbnails as base64
        run: |
          for f in /tmp/dual_ferrari.jpg /tmp/dual_insta.jpg; do
            echo "=== $f ==="
            base64 -w 0 "$f"
            echo ""
          done
