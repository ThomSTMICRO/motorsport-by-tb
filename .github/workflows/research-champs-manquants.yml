name: Research missing form fields impact on malus calculation

on:
  push:
    branches: [claude/animated-slides-website-7hkyof]
    paths: [.github/workflows/research-champs-manquants.yml]

jobs:
  test_fields_impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps
      - name: Dump rule formulas for énergie / invalidité / réception communautaire
        timeout-minutes: 8
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const base = 'https://www.service-public.gouv.fr/simulateur/calcul/cout-certificat-immatriculation';

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(base, { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1000);
            try { await page.click('button:has-text("Accepter")', { timeout: 3000 }); } catch (e) {}

            const fieldsRes = await page.evaluate(async (url) => {
              const res = await fetch(url + '/Default/fields', { method: 'POST', headers: {'content-type':'application/x-www-form-urlencoded'}, body: '' });
              return { status: res.status, text: await res.text() };
            }, base);
            console.log('FIELDS status:', fieldsRes.status, 'length:', fieldsRes.text.length);

            const json = JSON.parse(fieldsRes.text);
            console.log('TOP-LEVEL KEYS:', JSON.stringify(Object.keys(json)));

            const rules = json.rules || {};
            console.log('RULES TYPE:', Array.isArray(rules) ? 'array' : typeof rules, 'COUNT:', Array.isArray(rules) ? rules.length : Object.keys(rules).length);

            // IDs collectés depuis la 1ère passe pour energie / invalidite / receptionCommunautaire
            const idsInteret = [96,97,98,99,100,101,102,103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,121,122,123,124,152,153,154,155,161,163,166,167,168,169,170,173,174,175,176,177];

            const getRule = (id) => Array.isArray(rules) ? rules.find(r => r.id === id || r.Id === id) : rules[id];

            for (const id of idsInteret) {
              const r = getRule(id);
              if (r) console.log(`RULE ${id}:`, JSON.stringify(r).slice(0, 800));
            }

            // Dump aussi les datas liées au calcul final pour voir leur "evaluate"/formule si présente
            const datas = json.datas || {};
            const clesCalcul = ['Y1deBase','Y1Finale','infoSurtaxeY1_Idf','vehiculeExonereTaxeY1','ReductionMalusCO2_E85','reducCO2_E85','reducPA_E85','Hybrid_Recharg_Exonere','reducPoidsHybride','reducPoidsHybrideRecharg','hybrideRechargeable','hybrideNonRechargeable','typeVehicule','VehiculeTourisme','vehiculeDeCollection','demarcheExonere'];
            for (const k of clesCalcul) {
              if (datas[k]) console.log(`DATA ${k}:`, JSON.stringify(datas[k]).slice(0, 1000));
            }

            await browser.close();
          })().catch(e => { console.error('SCRIPT_ERROR', e); process.exit(1); });
          EOF
