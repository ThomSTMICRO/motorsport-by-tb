name: Build M5 showcase frame sequence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Extract ~100 evenly spaced frames, scaled and compressed
        run: |
          mkdir -p images/m5-showcase
          ffmpeg -y -i _tmp/bmw-m5-source.mov \
            -vf "select='not(mod(n\,5))',scale=960:-2" \
            -vsync vfr -q:v 6 \
            images/m5-showcase/frame_%04d.jpg
          echo "FRAME_COUNT: $(ls images/m5-showcase | wc -l)"
          du -sh images/m5-showcase

      - name: Remove raw source video (no longer needed)
        run: git rm -f _tmp/bmw-m5-source.mov

      - name: Commit and push frame sequence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/m5-showcase
          git status --short
          git commit -m "Génère la séquence d'images du showcase BMW M5 (frames extraites de la vidéo source, vidéo brute retirée)"
          git push
