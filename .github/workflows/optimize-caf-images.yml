name: Optimize Cars and Friends images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install imagemagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Resize and compress
        run: |
          cd images/cars-and-friends
          for f in quai-villefranche.jpg cercle-motorsport.jpg; do
            convert "$f" -auto-orient -resize 1600x1600\> -strip -quality 78 "$f.tmp" && mv "$f.tmp" "$f"
          done
          convert portes-papillon.jpg -auto-orient -resize 1600x1600\> -strip -quality 78 portes-papillon.jpg.tmp && mv portes-papillon.jpg.tmp portes-papillon.jpg
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/cars-and-friends
          git status --short
          git commit -m "Compresse les photos Cars and Friends" || echo "rien à committer"
          git push
